---
# code-map-and-set-names: end the name of every map and set with a plural noun of what it holds.
# Rust variant; the TypeScript and Tsx variants check the same holders of their own map and set types.
# Scan with this folder's sgconfig.yml and exclude the declared generated path patterns, such as
# `ast-grep scan -c .contracts/NNN-code-map-and-set-names/assets/ast-grep/sgconfig.yml --globs '!src/generated/**'`.
"id": "map-and-set-names-rust"
"language": "Rust"
"message": "End this map's or set's name with a plural noun of what it holds, such as `pending_jobs` or `seen_order_ids` rather than `pending` or `seen`."
"note": |
  A `let` binding, a struct field, and a parameter are checked when the type is `HashMap`, `BTreeMap`, `HashSet`, `BTreeSet`, `IndexMap`, or `IndexSet`, by value or by reference, alone or inside `Option`.
  A `let` binding is also checked when its value calls one of those types' `new`, `with_capacity`, `with_hasher`, `with_capacity_and_hasher`, `from`, `from_iter`, or `default`, or collects into one, such as `collect::<BTreeMap<_, _>>()`.
  The name passes when its last word ends in `s` but not in `ss` or `ous` and is not a listed singular noun, such as `status`, or when it is a listed irregular plural, such as `children`.
  A map or set that a call returns without an annotation is left to review.
  A map or set inside another wrapper type, such as `Arc<Mutex<HashMap<..>>>`, and a `static` item are left to review.
  Suppress a name that a system outside the repository fixes, with a reason that names that system.
"rule":
  "all":
    - "any":
        - "kind": "identifier"
        - "kind": "field_identifier"
    - "not":
        "matches": "plural-name"
    - "any":
        - "inside":
            "any":
              - "kind": "let_declaration"
              - "kind": "parameter"
            "field": "pattern"
            "matches": "collection-holder"
        - "inside":
            "field": "name"
            "kind": "field_declaration"
            "matches": "collection-holder"
"severity": "error"
"utils":
  # A binding, field, or parameter that holds a map or set.
  "collection-holder":
    "any":
      - "has":
          "field": "type"
          "matches": "collection-type"
      - "has":
          "field": "value"
          "matches": "collection-value"
  # A map or set type, by value or by reference, alone or inside `Option`, such as `&mut HashSet<OrderId>`.
  "collection-type":
    "regex": '^&?(?:''[A-Za-z_]+\s+)?(?:mut\s+)?(?:Option\s*<\s*)?(?:(?:std::)?collections::|indexmap::)?(?:HashMap|BTreeMap|HashSet|BTreeSet|IndexMap|IndexSet)\s*<'
  # A value that builds a map or set.
  "collection-value":
    "has":
      "any":
        # A constructor, such as `HashSet::new`, never another associated function, such as `HashSet::len`.
        - "all":
            - "has":
                "field": "path"
                "regex": "(?:^|::)(?:HashMap|BTreeMap|HashSet|BTreeSet|IndexMap|IndexSet)(?:::<.*>)?$"
            - "has":
                "field": "name"
                "regex": "^(?:new|with_capacity|with_hasher|with_capacity_and_hasher|from|from_iter|default)$"
          "kind": "scoped_identifier"
        - "has":
            "field": "type_arguments"
            "has":
              "matches": "collection-type"
          "kind": "generic_function"
      "field": "function"
    "kind": "call_expression"
...
