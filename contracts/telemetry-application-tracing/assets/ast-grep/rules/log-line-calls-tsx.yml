---
# telemetry-application-tracing: pass the logger function one object literal whose `event` field names the line's event, so each call site states its event.
# Tsx variant (.tsx); log-line-calls-typescript.yml is identical except for `id`, `language`, and this line.
"id": "log-line-calls-tsx"
"language": "Tsx"
"message": "Pass the logger one object literal with an `event` field, such as `log({ event: LogEvent.InvoiceSettled, invoiceId })`."
"note": |
  The logger function is the identifier that the shared `logger-function` rule names, `log` unless a repository's own copy names another.
  A call is allowed when its first argument is an object literal with an `event` pair or an `event` shorthand property.
  An argument built elsewhere, such as `log(line)` or `log({ ...line })`, is reported, because the call must state its event.
"rule":
  "has":
    "field": "function"
    "kind": "identifier"
    "matches": "logger-function"
  "kind": "call_expression"
  "not":
    "has":
      "field": "arguments"
      "has":
        "has":
          "any":
            - "has":
                "field": "key"
                "regex": '^(?:event|''event''|"event")$'
              "kind": "pair"
            - "kind": "shorthand_property_identifier"
              "regex": "^event$"
        "kind": "object"
        "nthChild": 1
"severity": "error"
...
