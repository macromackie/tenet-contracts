# code-typescript-import-statements: the declared namespace libraries, matched by the rules in ../rules as `misimported-namespace-library`.
# Each entry pairs one library's specifier with its namespace's name, the camelCase form of the package's name without its scope.
# An entry matches an import statement of its library that does more than import that namespace, with or without `type`.
# The shipped list is empty, so no library is checked until a repository declares one.
# A repository's copy adds one `all` entry per library: a `regex` for its specifier and a `not` holding a `regex` for its namespace import.
# Keep the libraries identical to the `ignore` list of `import/no-namespace` in ../../oxlint/oxlintrc.json.
# A repository adds its entries in its own copy of this file with the same `id`, loaded through its own `utilDirs` in place of this one.
# Each entry's regexes read only the statement's text, so the TypeScript and Tsx rules share them.
"id": "misimported-namespace-library"
"language": "TypeScript"
"rule":
  "any": []
...
