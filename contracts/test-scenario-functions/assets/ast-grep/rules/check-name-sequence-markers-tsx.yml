# test-scenario-functions: name each reported check and test case for its guarantee alone, without a sequence marker.
# Tsx variant (.tsx); check-name-sequence-markers-typescript.yml is identical except for `id`, `language`, and this line.
"id": "check-name-sequence-markers-tsx"
"language": "Tsx"
"message": "Name the check for its guarantee alone, such as `a replayed order returns the same invoice`, without a sequence letter, number, or step marker."
"note": |
  The rule reads a string or template literal that names a check: the value of a `name` field in an object literal, or the first argument of a `describe`, `it`, or `test` call, with or without a modifier such as `it.only`.
  It reports a name that starts with a marker: a parenthesized letter or number such as `(a)`, a single letter or a number before `.`, `)`, or `:` such as `3.` or `b)`, or `step` and a number, in either case.
  A repository whose reported checks carry their name in another field, or whose runner declares cases by another call, edits the `regex` values below.
"rule":
  "all":
    - "any":
        - "kind": "string"
        - "kind": "template_string"
    - "any":
        - "inside":
            "field": "value"
            "has":
              "field": "key"
              "regex": "^name$"
            "kind": "pair"
        - "inside":
            "inside":
              "has":
                "field": "function"
                "regex": '^(?:describe|it|test)(?:\.[A-Za-z]+)*$'
              "kind": "call_expression"
            "kind": "arguments"
          "nthChild": 1
  "regex": '^[''"`]\s*(?:\([A-Za-z0-9]{1,3}\)|(?:[A-Za-z]|[0-9]+)[.):]\s|[Ss][Tt][Ee][Pp]\s*[0-9]+)'
"severity": "error"
...
