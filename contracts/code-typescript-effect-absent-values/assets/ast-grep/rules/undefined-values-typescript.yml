# code-typescript-effect-absent-values: never write `undefined` as a value.
# TypeScript variant (.ts, .mts, .cts); undefined-values-tsx.yml is identical except for `id`, `language`, and this line.
"id": "undefined-values-typescript"
"language": "TypeScript"
"message": "Write a bare `return;`, leave the default or initializer out, or use `Option.none()`, instead of writing `undefined` as a value."
"note": |
  This reports an `= undefined` class field initializer, an `= undefined` `const` initializer anywhere, and `return undefined` and every `= undefined` default or initializer in a function that declares a return type.
  The lint's `no-useless-undefined` rule skips those and reports every other `undefined` value, including a trailing `undefined` argument.
"rule":
  "any":
    - "inside":
        "field": "value"
        "kind": "public_field_definition"
        "stopBy": "neighbor"
    - "inside":
        "field": "value"
        "inside":
          "kind": "lexical_declaration"
          "regex": '^const\b'
          "stopBy": "neighbor"
        "kind": "variable_declarator"
        "stopBy": "neighbor"
    - "all":
        - "any":
            - "inside":
                "kind": "return_statement"
                "stopBy": "neighbor"
            - "inside":
                "field": "value"
                "kind": "variable_declarator"
                "stopBy": "neighbor"
            - "inside":
                "field": "right"
                "kind": "object_assignment_pattern"
                "stopBy": "neighbor"
            - "inside":
                "field": "right"
                "kind": "assignment_pattern"
                "stopBy": "neighbor"
            - "inside":
                "field": "value"
                "kind": "required_parameter"
                "stopBy": "neighbor"
            - "inside":
                "field": "value"
                "kind": "optional_parameter"
                "stopBy": "neighbor"
        - "inside":
            "any":
              - "kind": "function_declaration"
              - "kind": "generator_function_declaration"
              - "kind": "function_expression"
              - "kind": "arrow_function"
              - "kind": "method_definition"
            "has":
              "field": "return_type"
              "kind": "type_annotation"
            "stopBy":
              "any":
                - "kind": "function_declaration"
                - "kind": "generator_function_declaration"
                - "kind": "function_expression"
                - "kind": "arrow_function"
                - "kind": "method_definition"
  "kind": "undefined"
"severity": "error"
...
