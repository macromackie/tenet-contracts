---
# code-typescript-effect-absent-values: set every field of a record in the literal that creates it.
# TypeScript variant (.ts, .mts, .cts); fields-after-literals-tsx.yml is identical except for `id`, `language`, and this line.
"id": "fields-after-literals-typescript"
"language": "TypeScript"
"message": "Set this field in the object literal that creates the record, such as `{ id, replaces: previous }` with `previous` an `Option`, instead of assigning it afterward."
"note": |
  This reports an assignment, including `+=` and `??=`, to a named property of a variable that a declaration directly in an enclosing block or the module initialized with an object literal, including one under `as` or `satisfies`.
  A computed key, such as `counts[id] = 1`, a record that a call or `new` created, a parameter or loop variable, and a collection method such as `push` are not reported.
"rule":
  "any":
    - "kind": "assignment_expression"
    - "kind": "augmented_assignment_expression"
  "has":
    "field": "left"
    "has":
      "field": "object"
      "kind": "identifier"
      "pattern": "$RECORD"
    "kind": "member_expression"
  "inside":
    "any":
      - "kind": "statement_block"
      - "kind": "program"
    "has":
      "any":
        - "kind": "lexical_declaration"
        - "kind": "variable_declaration"
        - "kind": "export_statement"
      "has":
        "all":
          - "has":
              "field": "name"
              "pattern": "$RECORD"
          - "has":
              "any":
                - "kind": "object"
                - "has":
                    "kind": "object"
                  "kind": "as_expression"
                - "has":
                    "kind": "object"
                  "kind": "satisfies_expression"
              "field": "value"
        "kind": "variable_declarator"
        "stopBy":
          "any":
            - "kind": "variable_declarator"
    "stopBy": "end"
"severity": "error"
...
