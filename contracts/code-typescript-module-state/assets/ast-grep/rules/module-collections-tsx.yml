---
# code-typescript-module-state: type each module-level `Set` or `Map` as `ReadonlySet<T>` or `ReadonlyMap<K, V>`.
# Tsx variant (.tsx); module-collections-typescript.yml differs only in `id`, `language`, and this line.
"id": "module-collections-tsx"
"ignores":
  # Scripts, whose top level code-script-entry-points governs.
  - "**/scripts/**"
  # Test files.
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/test/**"
  - "**/tests/**"
  - "**/testing/**"
  - "**/__tests__/**"
"language": "Tsx"
"message": "Annotate this module-level collection as `ReadonlySet<T>` or `ReadonlyMap<K, V>`, such as `const roles: ReadonlySet<Role> = new Set([...])`, or move a collection that code fills into the object or closure that owns it."
"note": |
  A top-level `const`, exported or not, whose value is `new Set(...)` or `new Map(...)` is reported unless its annotation is `ReadonlySet<...>` or `ReadonlyMap<...>`.
  The `new` expression may sit inside parentheses or an `as` or `satisfies` clause, neither of which makes the collection read-only.
  A collection that code fills after the module loads, such as a cache, is module state, which the annotation turns into a compile error; move it to its owner instead.
  A collection that another call returns, and a `WeakSet` or `WeakMap`, are left to review.
  Scripts and test files are exempt by the path patterns under `ignores`; replace them with the repository's declared paths.
"rule":
  "has":
    "field": "value"
    "matches": "collection-value"
  "matches": "module-const"
  "not":
    "has":
      "field": "type"
      "regex": '^:\s*Readonly(Set|Map)\s*<'
"severity": "error"
"utils":
  # A collection, bare or inside wrappers.
  "collection-value":
    "any":
      - "matches": "new-collection"
      - "has":
          "matches": "new-collection"
          "stopBy":
            "not":
              "matches": "value-wrapper"
        "matches": "value-wrapper"
  # A `const` declarator at the top level of the module, exported or not.
  "module-const":
    "inside":
      "inside":
        "any":
          - "kind": "program"
          - "inside":
              "kind": "program"
            "kind": "export_statement"
      "kind": "lexical_declaration"
      "regex": '^const\s'
    "kind": "variable_declarator"
  # `new Set(...)` or `new Map(...)`.
  "new-collection":
    "has":
      "field": "constructor"
      "regex": "^(Set|Map)$"
    "kind": "new_expression"
  # A node that wraps a value without changing it, such as `(value)` or `value satisfies ReadonlySet<Role>`.
  "value-wrapper":
    "any":
      - "kind": "parenthesized_expression"
      - "kind": "as_expression"
      - "kind": "satisfies_expression"
...
