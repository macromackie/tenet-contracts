---
"id": "immediately-invoked-function-tsx"
"language": "Tsx"
"message": "Compute the value with a named function called by name instead of invoking a function expression where it is written."
"rule":
  "any":
    - "has":
        "any":
          - "matches": "function-expression"
          - "all":
              - "has":
                  "field": "object"
                  "matches": "function-expression"
              - "has":
                  "field": "property"
                  "regex": "^(call|apply)$"
            "kind": "member_expression"
        "field": "function"
      "kind": "call_expression"
    - "has":
        "field": "constructor"
        "matches": "function-expression"
      "kind": "new_expression"
  "not":
    "matches": "discarded"
"severity": "error"
"utils":
  "discarded":
    "any":
      - "inside":
          "kind": "expression_statement"
      - "inside":
          "kind": "unary_expression"
          "regex": '^void\b'
      - "inside":
          "any":
            - "kind": "unary_expression"
            - "kind": "await_expression"
          "inside":
            "kind": "expression_statement"
  "function-expression":
    "any":
      - "kind": "arrow_function"
      - "kind": "function_expression"
      - "kind": "generator_function"
      - "has":
          "matches": "function-expression"
        "kind": "parenthesized_expression"
      - "has":
          "matches": "function-expression"
        "kind": "as_expression"
      - "has":
          "matches": "function-expression"
        "kind": "satisfies_expression"
      - "has":
          "matches": "function-expression"
        "kind": "non_null_expression"
      - "has":
          "matches": "function-expression"
          "nthChild":
            "position": 1
            "reverse": true
        "kind": "sequence_expression"
      - "has":
          "all":
            - "has":
                "field": "object"
                "matches": "function-expression"
            - "has":
                "field": "property"
                "regex": "^bind$"
          "field": "function"
          "kind": "member_expression"
        "kind": "call_expression"
...
