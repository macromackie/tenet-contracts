---
"id": "prop-gated-null-returns-tsx"
"language": "Tsx"
"message": "Let the caller show or skip this component with one && child; a component that stays mounted while hidden hides itself with styles instead of returning null."
"rule":
  "any":
    - "has":
        "field": "consequence"
        "matches": "returns-null"
      "kind": "if_statement"
      "matches": "prop-test"
    - "follows":
        "has":
          "any":
            - "kind": "return_statement"
            - "has":
                "kind": "return_statement"
              "kind": "statement_block"
          "field": "consequence"
        "kind": "if_statement"
        "matches": "prop-test"
      "pattern": "return null;"
"severity": "error"
"utils":
  "component":
    "any":
      - "has":
          "field": "name"
          "regex": "^[A-Z]"
        "kind": "function_declaration"
      - "has":
          "field": "name"
          "regex": "^[A-Z]"
        "kind": "function_expression"
      - "any":
          - "kind": "arrow_function"
          - "kind": "function_expression"
        "inside":
          "has":
            "field": "name"
            "regex": "^[A-Z]"
          "kind": "variable_declarator"
  "destructured-prop":
    "any":
      - "kind": "shorthand_property_identifier_pattern"
        "pattern": "$PROP"
      - "has":
          "field": "left"
          "pattern": "$PROP"
        "kind": "object_assignment_pattern"
      - "has":
          "field": "value"
          "pattern": "$PROP"
        "kind": "pair_pattern"
  "destructuring-component":
    "has":
      "field": "parameters"
      "has":
        "any":
          - "kind": "required_parameter"
          - "kind": "optional_parameter"
        "has":
          "field": "pattern"
          "has":
            "matches": "destructured-prop"
          "kind": "object_pattern"
        "nthChild": 1
    "matches": "component"
  "prop-test":
    "any":
      - "all":
          - "has":
              "field": "condition"
              "has":
                "any":
                  - "kind": "identifier"
                    "pattern": "$PROP"
                  - "has":
                      "field": "argument"
                      "kind": "identifier"
                      "pattern": "$PROP"
                    "kind": "unary_expression"
                    "regex": "^!"
              "kind": "parenthesized_expression"
          - "inside":
              "inside":
                "matches": "destructuring-component"
              "kind": "statement_block"
      - "all":
          - "has":
              "any":
                - "pattern": "(!$PROPS.$PROP)"
                - "pattern": "($PROPS.$PROP)"
              "field": "condition"
          - "inside":
              "inside":
                "matches": "props-object-component"
              "kind": "statement_block"
      - "all":
          - "has":
              "field": "condition"
              "has":
                "any":
                  - "kind": "identifier"
                    "pattern": "$PROP"
                  - "has":
                      "field": "argument"
                      "kind": "identifier"
                      "pattern": "$PROP"
                    "kind": "unary_expression"
                    "regex": "^!"
              "kind": "parenthesized_expression"
          - "follows":
              "has":
                "all":
                  - "has":
                      "field": "name"
                      "has":
                        "matches": "destructured-prop"
                      "kind": "object_pattern"
                  - "has":
                      "field": "value"
                      "kind": "identifier"
                      "pattern": "$PROPS"
                "kind": "variable_declarator"
              "kind": "lexical_declaration"
              "stopBy": "end"
          - "inside":
              "inside":
                "matches": "props-object-component"
              "kind": "statement_block"
  "props-object-component":
    "any":
      - "has":
          "field": "parameters"
          "has":
            "any":
              - "kind": "required_parameter"
              - "kind": "optional_parameter"
            "has":
              "field": "pattern"
              "kind": "identifier"
              "pattern": "$PROPS"
            "nthChild": 1
      - "has":
          "field": "parameter"
          "kind": "identifier"
          "pattern": "$PROPS"
    "matches": "component"
  "returns-null":
    "any":
      - "pattern": "return null;"
      - "has":
          "pattern": "return null;"
        "kind": "statement_block"
...
