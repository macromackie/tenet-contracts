---
"id": "complementary-markup-children-tsx"
"language": "Tsx"
"message": "Choose between the two branches in a component whose if statements each return one branch, not in sibling children on a condition and its negation."
"rule":
  "any":
    - "any":
        - "follows":
            "matches": "negated-child"
            "stopBy": "end"
        - "precedes":
            "matches": "negated-child"
            "stopBy": "end"
      "has":
        "any":
          - "pattern": "$CONDITION && $BRANCH"
          - "pattern": "$CONDITION && $GUARD && $BRANCH"
        "kind": "binary_expression"
    - "any":
        - "follows":
            "matches": "unequal-child"
            "stopBy": "end"
        - "precedes":
            "matches": "unequal-child"
            "stopBy": "end"
      "has":
        "any":
          - "pattern": "$LEFT === $RIGHT && $BRANCH"
          - "pattern": "$LEFT === $RIGHT && $GUARD && $BRANCH"
        "kind": "binary_expression"
  "kind": "jsx_expression"
"severity": "error"
"utils":
  "negated-child":
    "has":
      "any":
        - "pattern": "!$CONDITION && $OTHER"
        - "pattern": "!$CONDITION && $GUARD && $OTHER"
      "kind": "binary_expression"
    "kind": "jsx_expression"
  "unequal-child":
    "has":
      "any":
        - "pattern": "$LEFT !== $RIGHT && $OTHER"
        - "pattern": "$LEFT !== $RIGHT && $GUARD && $OTHER"
      "kind": "binary_expression"
    "kind": "jsx_expression"
...
