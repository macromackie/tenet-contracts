# code-typescript-effect-scheduling: sleep with `Effect.sleep` and bound waits with `Effect.timeout`, never with a timer or a deadline signal.
# Tsx variant (.tsx); timer-waits-typescript.yml is identical except for `id`, `language`, and this line.
"id": "timer-waits-tsx"
"language": "Tsx"
"message": "Sleep with `Effect.sleep` and bound a wait with `Effect.timeout` or `Effect.timeoutOrElse`, instead of a timer, a promise timers module, or `AbortSignal.timeout`."
"note": |
  Sleep with `yield* Effect.sleep(POLL_INTERVAL)`, repeat with `Effect.repeat` and a `Schedule`, and bound a wait with `Effect.timeout`.
  A foreign call stops at the deadline when it receives the `signal` that `Effect.tryPromise` hands its function.
  A component delays or repeats work by forking the Effect in its effect callback and interrupting the fiber in that callback's cleanup.
  The rule reports `setTimeout` and `setInterval`, called, passed by name, or read from `globalThis`, `window`, or `self`, an import of a promise timers module or of `setTimeout` or `setInterval` from a timers module, and `AbortSignal.timeout`.
"rule":
  "any":
    # `setTimeout(resolve, 250)` and `promisify(setTimeout)`.
    # An import of the name is reported once, by its import statement, and a type such as `ReturnType<typeof setTimeout>` is not reported.
    - "kind": "identifier"
      "not":
        "any":
          - "inside":
              "kind": "import_statement"
              "stopBy": "end"
          - "inside":
              "kind": "type_query"
      "regex": "^(setTimeout|setInterval)$"
    # `globalThis.setTimeout(...)` and `window.setInterval(...)`.
    - "all":
        - "has":
            "field": "object"
            "kind": "identifier"
            "regex": "^(globalThis|window|self)$"
        - "has":
            "field": "property"
            "regex": "^(setTimeout|setInterval)$"
        - "not":
            "inside":
              "kind": "type_query"
      "kind": "member_expression"
    # `import { setTimeout as sleep } from 'node:timers/promises'`.
    - "has":
        "field": "source"
        "regex": '^[''"](node:)?timers/promises[''"]$'
      "kind": "import_statement"
    # `import { setTimeout as wait } from 'node:timers'`, but not `import { setImmediate } from 'node:timers'`.
    - "all":
        - "has":
            "field": "source"
            "regex": '^[''"](node:)?timers[''"]$'
        - "has":
            "has":
              "field": "name"
              "regex": "^(setTimeout|setInterval)$"
            "kind": "import_specifier"
            "stopBy": "end"
      "kind": "import_statement"
    # `signal: AbortSignal.timeout(60_000)`.
    - "all":
        - "has":
            "field": "object"
            "kind": "identifier"
            "regex": "^AbortSignal$"
        - "has":
            "field": "property"
            "regex": "^timeout$"
      "kind": "member_expression"
"severity": "error"
...
