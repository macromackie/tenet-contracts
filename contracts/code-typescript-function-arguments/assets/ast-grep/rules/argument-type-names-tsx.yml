---
# code-typescript-function-arguments: name a function's argument type its PascalCase name plus `Input`, and a component's its name plus `Props`.
# Tsx variant (.tsx); argument-type-names-typescript.yml parses the same rule without JSX.
# Keep the two identical except for `id`, `language`, and this comment.
"id": "argument-type-names-tsx"
"language": "Tsx"
"message": "Type this destructured argument with a named type that ends in `Input`, or in `Props` for a component, such as `retryStep({ job }: RetryStepInput)`."
"note": |
  Name the type for the function: `retryStep` takes `RetryStepInput`, the `post` method takes `PostInput`, and the `InvoiceRow` component takes `InvoiceRowProps`.
  A function whose name starts with a capital letter is treated as a component; a constructor's type is named for its class, such as `LedgerInput`.
  The rule checks the suffix only; review checks that the rest of the name is the function's own name.
  It reads a destructured parameter with a type annotation in an owned function, including the generator body of a named `Effect.fn` binding.
  Other functions written directly as a call's argument keep the dependency's signature.
  A type wrapped in an operator or utility, such as `Readonly<RetryStepInput>` or `Pick<Invoice, 'id'>`, is reported; declare a named type instead.
  A parameter whose type a dependency declares, such as a framework's loader argument, is suppressed with a reason that names that type.
"rule":
  "any":
    # A component's argument whose type does not end in `Props`.
    - "all":
        - "not":
            "has":
              "field": "type"
              "has":
                "matches": "props-type"
        - "inside":
            "inside":
              "all":
                - "matches": "component"
              "matches": "owned-function"
            "kind": "formal_parameters"
    # Any other function's argument whose type does not end in `Input`.
    - "all":
        - "not":
            "has":
              "field": "type"
              "has":
                "matches": "input-type"
        - "inside":
            "inside":
              "matches": "owned-function"
              "not":
                "matches": "component"
            "kind": "formal_parameters"
  "matches": "destructured-parameter"
"severity": "error"
"utils":
  # A function bound to a capitalized name, such as `function InvoiceRow` or `const InvoiceRow = (...) =>`.
  "component":
    "any":
      - "all":
          - "any":
              - "kind": "function_declaration"
              - "kind": "function_expression"
          - "has":
              "field": "name"
              "regex": "^[A-Z]"
      - "all":
          - "any":
              - "kind": "arrow_function"
              - "kind": "function_expression"
          - "inside":
              "field": "value"
              "has":
                "field": "name"
                "kind": "identifier"
                "regex": "^[A-Z]"
              "kind": "variable_declarator"
      - "all":
          - "kind": "generator_function"
          - "inside":
              "inside":
                "inside":
                  "field": "value"
                  "has":
                    "field": "name"
                    "kind": "identifier"
                    "regex": "^[A-Z]"
                  "kind": "variable_declarator"
                "matches": "traced-function"
              "kind": "arguments"
  "destructured-parameter":
    "all":
      - "has":
          "field": "pattern"
          "kind": "object_pattern"
      - "has":
          "field": "type"
          "kind": "type_annotation"
    "any":
      - "kind": "required_parameter"
      - "kind": "optional_parameter"
  # A named type, plain, qualified, or generic, whose name ends in `Input`, and one whose name ends in `Props`.
  "input-type":
    "any":
      - "kind": "type_identifier"
        "regex": "Input$"
      - "kind": "nested_type_identifier"
        "regex": "Input$"
      - "has":
          "field": "name"
          "regex": "Input$"
        "kind": "generic_type"
  # An Effect.fn body has owned arguments; other callbacks keep the callee's signature.
  "owned-function":
    "all":
      - "any":
          - "not":
              "inside":
                "kind": "arguments"
          - "all":
              - "kind": "generator_function"
              - "inside":
                  "inside":
                    "matches": "traced-function"
                  "kind": "arguments"
    "any":
      - "kind": "function_declaration"
      - "kind": "generator_function_declaration"
      - "kind": "function_expression"
      - "kind": "generator_function"
      - "kind": "arrow_function"
      - "kind": "method_definition"
      - "kind": "function_signature"
      - "kind": "abstract_method_signature"
  "props-type":
    "any":
      - "kind": "type_identifier"
        "regex": "Props$"
      - "kind": "nested_type_identifier"
        "regex": "Props$"
      - "has":
          "field": "name"
          "regex": "Props$"
        "kind": "generic_type"
  # The outer builder call is a function value; its generator has the owned signature.
  "traced-function":
    "has":
      "field": "function"
      "has":
        "field": "function"
        "pattern": "Effect.fn"
      "kind": "call_expression"
    "kind": "call_expression"
...
