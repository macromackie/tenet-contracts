# code-spelled-out-names: case each acronym or initialism inside a name as a word, so that no two capitals stand in a row.
# JavaScript variant (.js, .mjs, .cjs, .jsx); the TypeScript and Tsx variants also check the names that only their grammar declares, such as types and enums.
# Scan with this folder's sgconfig.yml and exclude the declared generated path patterns, such as
# `ast-grep scan -c .contracts/NNN-code-spelled-out-names/assets/ast-grep/sgconfig.yml --globs '!src/generated/**'`.
id: acronym-names-javascript
language: JavaScript
severity: error
message: Case this acronym as a word, such as `callbackUrl`, `parseJson`, or `HttpClient`, so that no two capitals stand in a row.
note: |
  A variable, a parameter, a destructured or rest binding, a loop or catch binding, a default import or an import or export alias, a function, a class, a method, a field, and an object key are checked.
  A name that holds a lowercase letter is reported when it holds two capitals in a row, so `callbackURL`, `HTTPClient`, and `XAxis` are reported, while `callbackUrl`, `HttpClient`, `S3Client`, and `utf8Decoder` are not.
  A name of capitals, digits, and underscores alone, such as `MAX_URL_LENGTH` or `GET`, is SCREAMING_SNAKE_CASE and is not reported, unless a class takes it, such as `class URL`.
  A read of another system's name, such as `url.toISOString()`, an import that keeps it, such as `import { fileURLToPath }`, or a shorthand destructured binding, such as `const { baseURL } = options`, declares nothing, so none is checked.
  Suppress a name that a framework, dependency, or the language fixes, such as an option key `baseURL` that a client library reads or a `toJSON` method, with a reason that names that system.
utils:
  # A name that a declaration introduces.
  declared-name:
    any:
      - kind: identifier
        any:
          - inside:
              field: name
              any:
                - kind: variable_declarator
                - kind: function_declaration
                - kind: generator_function_declaration
                - kind: function_expression
          - inside:
              kind: formal_parameters
          - inside:
              field: parameter
              kind: arrow_function
          - inside:
              any:
                - kind: array_pattern
                - kind: rest_pattern
                - kind: import_clause
                - kind: namespace_import
          - inside:
              field: value
              kind: pair_pattern
          - inside:
              field: left
              any:
                - kind: assignment_pattern
                - kind: for_in_statement
          - inside:
              field: parameter
              kind: catch_clause
          - inside:
              field: alias
              any:
                - kind: import_specifier
                - kind: export_specifier
      - matches: type-name
      - kind: property_identifier
        any:
          - inside:
              field: name
              kind: method_definition
          - inside:
              field: property
              kind: field_definition
          - inside:
              field: key
              kind: pair
      - kind: private_property_identifier
        any:
          - inside:
              field: name
              kind: method_definition
          - inside:
              field: property
              kind: field_definition
  # A name that only a class takes.
  type-name:
    kind: identifier
    inside:
      field: name
      any:
        - kind: class_declaration
        - kind: class
rule:
  matches: declared-name
  any:
    - all:
        - regex: '[A-Z]{2}'
        - regex: '[a-z]'
    - all:
        - matches: type-name
        - regex: '^[A-Z][A-Z0-9_]+$'
