# code-spelled-out-names: case each acronym or initialism inside a name as a word, so that no two capitals stand in a row.
# Rust variant.
# Scan with this folder's sgconfig.yml and exclude the declared generated path patterns, such as
# `ast-grep scan -c .contracts/NNN-code-spelled-out-names/assets/ast-grep/sgconfig.yml --globs '!src/generated/**'`.
id: acronym-names-rust
language: Rust
severity: error
message: Case this acronym as a word, such as `callback_url` or `HttpClient`, so that no two capitals stand in a row.
note: |
  A function, a method, a trait's method declaration, a variable, a parameter, a pattern or loop binding, a `use` alias, a field, a type, a trait, a trait's associated type, a type parameter, a module, a macro, an enum variant, a constant, and a static are checked.
  A name that holds a lowercase letter is reported when it holds two capitals in a row, so `HTTPClient`, `JSONValue`, and `XAxis` are reported, while `HttpClient`, `JsonValue`, and `S3Client` are not.
  A name of capitals, digits, and underscores alone, such as a constant `MAX_URL_LENGTH`, is SCREAMING_SNAKE_CASE and is not reported, unless a type, a trait, or a type parameter takes it, such as `struct URL`; `code-rust-source-structure`'s case for enum variants covers a variant such as `GET`.
  A method or an associated type that implements a trait keeps the trait's name, and a name that another system declares, such as an imported `HTTPClient`, is read rather than declared, so neither is checked.
  Suppress another name that a framework or dependency fixes with a reason that names that system.
utils:
  # A name that a declaration introduces.
  declared-name:
    any:
      - kind: identifier
        any:
          - inside:
              field: name
              any:
                - kind: function_signature_item
                - kind: const_item
                - kind: static_item
                - kind: enum_variant
                - kind: mod_item
                - kind: macro_definition
                - kind: function_item
                  not:
                    # A method that implements a trait keeps the trait's name.
                    inside:
                      kind: declaration_list
                      inside:
                        kind: impl_item
                        has:
                          field: trait
                          regex: .
          - inside:
              field: pattern
              any:
                - kind: let_declaration
                - kind: parameter
          - inside:
              kind: closure_parameters
          - inside:
              any:
                - kind: tuple_pattern
                - kind: slice_pattern
                - kind: field_pattern
                - kind: ref_pattern
          - inside:
              kind: tuple_struct_pattern
            not:
              # The pattern's type, such as `Some` in `Some(row)`, names a variant rather than a binding.
              inside:
                kind: tuple_struct_pattern
                field: type
          - inside:
              kind: for_expression
              field: pattern
          - inside:
              kind: use_as_clause
              field: alias
      - kind: field_identifier
        inside:
          field: name
          kind: field_declaration
      - matches: type-name
  # A name that only a type, a trait, or a type parameter takes.
  type-name:
    kind: type_identifier
    inside:
      field: name
      any:
        - kind: struct_item
        - kind: enum_item
        - kind: trait_item
        - kind: union_item
        - kind: type_parameter
        - kind: associated_type
        - kind: type_item
          not:
            # An associated type that implements a trait keeps the trait's name.
            inside:
              kind: declaration_list
              inside:
                kind: impl_item
                has:
                  field: trait
                  regex: .
rule:
  matches: declared-name
  any:
    - all:
        - regex: '[A-Z]{2}'
        - regex: '[a-z]'
    - all:
        - matches: type-name
        - regex: '^[A-Z][A-Z0-9_]+$'
