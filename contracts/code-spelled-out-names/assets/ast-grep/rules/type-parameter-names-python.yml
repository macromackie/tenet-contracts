# code-spelled-out-names: name every type parameter with a word, such as `Row` or `Catalog`, never one character such as `T`.
# Python variant; it checks a type parameter list, as in `def read_first[Row](rows: list[Row]) -> Row`, and a type variable that an assignment declares.
# Scan with this folder's sgconfig.yml and exclude the declared generated path patterns, such as
# `ast-grep scan -c .contracts/NNN-code-spelled-out-names/assets/ast-grep/sgconfig.yml --globs '!src/generated/**'`.
id: type-parameter-names-python
language: Python
severity: error
message: Name this type parameter with a word for what it stands for, such as `Row = TypeVar("Row")` or `def read_first[Row]`, rather than one character.
note: |
  A type parameter of a function, a class, or a `type` statement is checked, including a bounded one, such as `[T: Invoice]`, and a starred one, such as `[*S]`.
  A target of `TypeVar`, `ParamSpec`, or `TypeVarTuple`, such as `T = TypeVar("T")`, is a type variable, so it is checked too.
  A name of one character in any case is reported; longer names, such as `Row` and `Catalog`, are not.
  A subscript that uses a type parameter, such as `list[Row]`, is a reference and is not checked.
utils:
  # The bracketed list that declares type parameters, as in `def read_first[Row]`, `class Page[Row]`, or `type Pairs[Key] = ...`.
  declared-type-parameters:
    kind: type_parameter
    any:
      - inside:
          field: type_parameters
          any:
            - kind: function_definition
            - kind: class_definition
      - inside:
          kind: generic_type
          inside:
            kind: type
            inside:
              kind: type_alias_statement
              field: left
  # One entry of that list, bare, starred, or bounded.
  declared-type:
    kind: type
    inside:
      matches: declared-type-parameters
rule:
  kind: identifier
  regex: ^.$
  any:
    - inside:
        matches: declared-type
    - inside:
        kind: splat_type
        inside:
          matches: declared-type
    - inside:
        kind: type
        nthChild: 1
        inside:
          kind: constrained_type
          inside:
            matches: declared-type
    - inside:
        kind: assignment
        field: left
        has:
          field: right
          kind: call
          has:
            field: function
            regex: ^((typing|typing_extensions)\.)?(TypeVar|ParamSpec|TypeVarTuple)$
