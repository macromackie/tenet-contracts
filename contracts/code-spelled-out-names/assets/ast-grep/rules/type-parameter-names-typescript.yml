# code-spelled-out-names: name every type parameter with a word, such as `Row` or `Catalog`, never one character such as `T`.
# TypeScript variant (.ts, .mts, .cts); type-parameter-names-tsx.yml differs only in `id`, `language`, and this line.
# Scan with this folder's sgconfig.yml and exclude the declared generated path patterns, such as
# `ast-grep scan -c .contracts/NNN-code-spelled-out-names/assets/ast-grep/sgconfig.yml --globs '!src/generated/**'`.
id: type-parameter-names-typescript
language: TypeScript
severity: error
message: Name this type parameter with a word for what it stands for, such as `Row` in `readFirst<Row>`, rather than one character.
note: |
  A type parameter of a function, method, class, type, or interface, a mapped type's key, and an `infer` type are declared names, so each is checked.
  A name of one character in any case is reported; longer names, such as `Row`, `Key`, and `Catalog`, are not.
  A reference to a type parameter, such as `readonly Row[]`, is not a declaration and is not checked.
rule:
  kind: type_identifier
  regex: ^.$
  any:
    - inside:
        field: name
        any:
          - kind: type_parameter
          - kind: mapped_type_clause
    - nthChild: 1
      inside:
        kind: infer_type
