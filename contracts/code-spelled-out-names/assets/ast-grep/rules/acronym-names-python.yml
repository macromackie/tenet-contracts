---
# code-spelled-out-names: case each acronym or initialism inside a name as a word, so that no two capitals stand in a row.
# Python variant.
# Scan with this folder's sgconfig.yml and exclude the declared generated path patterns, such as
# `ast-grep scan -c .contracts/NNN-code-spelled-out-names/assets/ast-grep/sgconfig.yml --globs '!src/generated/**'`.
"id": "acronym-names-python"
"language": "Python"
"message": "Case this acronym as a word, such as `callback_url` or `HttpClient`, so that no two capitals stand in a row."
"note": |
  A function, a method, a class, a type alias, a type parameter, a type variable, a function's or lambda's parameter, a variable that an assignment declares, a field assigned on `self`, a loop, `with`, comprehension, or walrus target, and an import alias are checked.
  A name that holds a lowercase letter is reported when it holds two capitals in a row, so `parse_JSON`, `HTTPClient`, and `XAxis` are reported, while `parse_json`, `HttpClient`, and `S3Client` are not.
  A name of capitals, digits, and underscores alone, such as `MAX_URL_LENGTH` or an enum member `PAID`, is SCREAMING_SNAKE_CASE and is not reported, unless a class, a type alias, a type parameter, or a type variable takes it, such as `class URL`, `type URL = str`, or `ID = TypeVar("ID")`.
  A name that another system declares, such as an imported `HTTPServer`, is read rather than declared, so it is not checked.
  Suppress a name that a framework or dependency fixes, such as a request handler's `do_GET` method, with a reason that names that system.
"rule":
  "any":
    - "all":
        - "regex": "[A-Z]{2}"
        - "regex": "[a-z]"
    - "all":
        - "matches": "type-name"
        - "regex": "^[A-Z][A-Z0-9_]+$"
  "matches": "declared-name"
"severity": "error"
"utils":
  # A name that a declaration introduces.
  "declared-name":
    "any":
      - "inside":
          "any":
            - "kind": "function_definition"
            - "kind": "class_definition"
          "field": "name"
      - "inside":
          "kind": "parameters"
      - "inside":
          "any":
            - "kind": "default_parameter"
            - "kind": "typed_default_parameter"
          "field": "name"
      - "inside":
          "kind": "typed_parameter"
        "nthChild": 1
      - "inside":
          "field": "left"
          "kind": "assignment"
      - "inside":
          "any":
            - "kind": "pattern_list"
            - "kind": "tuple_pattern"
          "inside":
            "any":
              - "kind": "assignment"
              - "kind": "for_statement"
              - "kind": "for_in_clause"
            "field": "left"
      - "inside":
          "kind": "lambda_parameters"
      - "inside":
          "any":
            - "kind": "list_splat_pattern"
            - "kind": "dictionary_splat_pattern"
          "inside":
            "any":
              - "kind": "parameters"
              - "kind": "lambda_parameters"
              - "kind": "typed_parameter"
      - "inside":
          "any":
            - "kind": "for_statement"
            - "kind": "for_in_clause"
          "field": "left"
      - "inside":
          "kind": "as_pattern_target"
      - "inside":
          "field": "name"
          "kind": "named_expression"
      - "inside":
          "field": "alias"
          "kind": "aliased_import"
      - "inside":
          "field": "attribute"
          "has":
            "field": "object"
            "regex": "^self$"
          "inside":
            "field": "left"
            "kind": "assignment"
          "kind": "attribute"
      - "matches": "type-name"
    "kind": "identifier"
  # A list that declares type parameters, as in `def read_first[Row]` or `type Pairs[Key] = ...`.
  "declared-type-parameters":
    "any":
      - "inside":
          "any":
            - "kind": "function_definition"
            - "kind": "class_definition"
          "field": "type_parameters"
      - "inside":
          "inside":
            "inside":
              "field": "left"
              "kind": "type_alias_statement"
            "kind": "type"
          "kind": "generic_type"
    "kind": "type_parameter"
  # A name that only a class, a type alias, a type parameter, or a type variable takes.
  "type-name":
    "any":
      - "inside":
          "field": "name"
          "kind": "class_definition"
      - "inside":
          "inside":
            "field": "left"
            "kind": "type_alias_statement"
          "kind": "type"
      - "inside":
          "inside":
            "inside":
              "field": "left"
              "kind": "type_alias_statement"
            "kind": "type"
          "kind": "generic_type"
      - "inside":
          "inside":
            "matches": "declared-type-parameters"
          "kind": "type"
      - "inside":
          "inside":
            "inside":
              "matches": "declared-type-parameters"
            "kind": "type"
          "kind": "splat_type"
      - "inside":
          "inside":
            "inside":
              "inside":
                "matches": "declared-type-parameters"
              "kind": "type"
            "kind": "constrained_type"
          "kind": "type"
          "nthChild": 1
      - "inside":
          "field": "left"
          "has":
            "field": "right"
            "has":
              "field": "function"
              "regex": '^((typing|typing_extensions)\.)?(TypeVar|ParamSpec|TypeVarTuple)$'
            "kind": "call"
          "kind": "assignment"
    "kind": "identifier"
...
