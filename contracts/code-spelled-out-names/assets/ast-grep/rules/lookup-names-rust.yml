# code-spelled-out-names: the word list maps `get`, `fetch`, and `load` to `read`, so no declared name starts with one of those words.
# Rust variant.
# Scan with this folder's sgconfig.yml and exclude the declared generated path patterns, such as
# `ast-grep scan -c .contracts/NNN-code-spelled-out-names/assets/ast-grep/sgconfig.yml --globs '!src/generated/**'`.
id: lookup-names-rust
language: Rust
severity: error
message: Start this name with `read` rather than `get`, `fetch`, or `load`, such as `read_invoice` for `get_invoice`, `fetch_invoice`, or `load_invoice`.
note: |
  A function, a method, a trait's method declaration, a variable, a parameter, a pattern or loop binding, a `use` alias, a field, a type, a trait, a trait's associated type, a type parameter, a module, a macro, an enum variant, a constant, and a static are checked.
  The first word is the name's leading run after any underscores, in any case style, so `get_invoice`, `GetInvoice`, and `GET_LIMIT` start with `get`, as `fetch_invoice` and `LoadInvoice` start with `fetch` and `load`, while `getter` does not.
  A method or an associated type that implements a trait keeps the trait's name, and a call such as `rows.get(&key)` declares nothing, so neither is checked.
  A shorthand field pattern, such as `Request { get_all }`, keeps the field's name, so the field's declaration is the one checked.
  Suppress another name that an interface or framework outside the repository fixes with a reason that names that system.
utils:
  # A name that a declaration introduces.
  declared-name:
    any:
      - kind: identifier
        any:
          - inside:
              field: name
              any:
                - kind: function_signature_item
                - kind: const_item
                - kind: static_item
                - kind: enum_variant
                - kind: mod_item
                - kind: macro_definition
                - kind: function_item
                  not:
                    # A method that implements a trait keeps the trait's name.
                    inside:
                      kind: declaration_list
                      inside:
                        kind: impl_item
                        has:
                          field: trait
                          regex: .
          - inside:
              field: pattern
              any:
                - kind: let_declaration
                - kind: parameter
          - inside:
              kind: closure_parameters
          - inside:
              any:
                - kind: tuple_pattern
                - kind: slice_pattern
                - kind: field_pattern
                - kind: ref_pattern
          - inside:
              kind: tuple_struct_pattern
            not:
              # The pattern's type, such as `Some` in `Some(row)`, names a variant rather than a binding.
              inside:
                kind: tuple_struct_pattern
                field: type
          - inside:
              kind: for_expression
              field: pattern
          - inside:
              kind: use_as_clause
              field: alias
      - kind: field_identifier
        inside:
          field: name
          kind: field_declaration
      - matches: type-name
  # A name that only a type, a trait, or a type parameter takes.
  type-name:
    kind: type_identifier
    inside:
      field: name
      any:
        - kind: struct_item
        - kind: enum_item
        - kind: trait_item
        - kind: union_item
        - kind: type_parameter
        - kind: associated_type
        - kind: type_item
          not:
            # An associated type that implements a trait keeps the trait's name.
            inside:
              kind: declaration_list
              inside:
                kind: impl_item
                has:
                  field: trait
                  regex: .
rule:
  matches: declared-name
  regex: ^_*((get|Get|fetch|Fetch|load|Load)([^a-z]|$)|(GET|FETCH|LOAD)([_0-9]|$))
