---
# code-spelled-out-names: case each acronym or initialism inside a name as a word, so that no two capitals stand in a row.
# TypeScript variant (.ts, .mts, .cts); acronym-names-tsx.yml differs only in `id`, `language`, and this line.
# Scan with this folder's sgconfig.yml and exclude the declared generated path patterns, such as
# `ast-grep scan -c .contracts/NNN-code-spelled-out-names/assets/ast-grep/sgconfig.yml --globs '!src/generated/**'`.
"id": "acronym-names-typescript"
"language": "TypeScript"
"message": "Case this acronym as a word, such as `callbackUrl`, `parseJson`, or `HttpClient`, so that no two capitals stand in a row."
"note": |
  A variable, a parameter, a destructured or rest binding, a loop or catch binding, a default import or an import or export alias, a function, a class, a method, a field, a property signature, an object key, a type, a type parameter, including a mapped type's key and an `infer` type, a namespace, an enum, and an enum member are checked.
  A name that holds a lowercase letter is reported when it holds two capitals in a row, so `callbackURL`, `HTTPClient`, `IOrder`, `TRow`, and `XAxis` are reported, while `callbackUrl`, `HttpClient`, `S3Client`, and `utf8Decoder` are not.
  A name of capitals, digits, and underscores alone, such as `MAX_URL_LENGTH`, `GET`, or an enum member `PAID`, is SCREAMING_SNAKE_CASE and is not reported, unless a class, interface, type, type parameter, or enum takes it, such as `type URL = string`.
  A read of another system's name, such as `url.toISOString()`, an import that keeps it, such as `import { fileURLToPath }`, or a shorthand destructured binding, such as `const { baseURL } = options`, declares nothing, so none is checked.
  Suppress a name that a framework, dependency, or the language fixes, such as an option key `baseURL` that a client library reads or a `toJSON` method, with a reason that names that system.
"rule":
  "any":
    - "all":
        - "regex": "[A-Z]{2}"
        - "regex": "[a-z]"
    - "all":
        - "matches": "type-name"
        - "regex": "^[A-Z][A-Z0-9_]+$"
  "matches": "declared-name"
"severity": "error"
"utils":
  # A name that a declaration introduces.
  "declared-name":
    "any":
      - "any":
          - "inside":
              "any":
                - "kind": "variable_declarator"
                - "kind": "function_declaration"
                - "kind": "generator_function_declaration"
                - "kind": "function_expression"
                - "kind": "enum_declaration"
              "field": "name"
          - "inside":
              "any":
                - "kind": "required_parameter"
                - "kind": "optional_parameter"
              "field": "pattern"
          - "inside":
              "field": "parameter"
              "kind": "arrow_function"
          - "inside":
              "any":
                - "kind": "array_pattern"
                - "kind": "rest_pattern"
                - "kind": "import_clause"
                - "kind": "namespace_import"
          - "inside":
              "field": "value"
              "kind": "pair_pattern"
          - "inside":
              "any":
                - "kind": "assignment_pattern"
                - "kind": "for_in_statement"
              "field": "left"
          - "inside":
              "field": "parameter"
              "kind": "catch_clause"
          - "inside":
              "any":
                - "kind": "function_signature"
                - "kind": "internal_module"
                - "kind": "module"
              "field": "name"
          - "inside":
              "any":
                - "kind": "import_specifier"
                - "kind": "export_specifier"
              "field": "alias"
        "kind": "identifier"
      - "matches": "type-name"
      - "any":
          - "inside":
              "any":
                - "kind": "method_definition"
                - "kind": "method_signature"
                - "kind": "abstract_method_signature"
                - "kind": "property_signature"
                - "kind": "public_field_definition"
                - "kind": "enum_assignment"
              "field": "name"
          - "inside":
              "field": "key"
              "kind": "pair"
          - "inside":
              "kind": "enum_body"
        "kind": "property_identifier"
      - "inside":
          "any":
            - "kind": "method_definition"
            - "kind": "public_field_definition"
          "field": "name"
        "kind": "private_property_identifier"
  # A name that only a type, a type parameter, or an enum takes.
  "type-name":
    "any":
      - "inside":
          "any":
            - "kind": "class_declaration"
            - "kind": "abstract_class_declaration"
            - "kind": "class"
            - "kind": "interface_declaration"
            - "kind": "type_alias_declaration"
            - "kind": "type_parameter"
            - "kind": "mapped_type_clause"
          "field": "name"
        "kind": "type_identifier"
      - "inside":
          "kind": "infer_type"
        "kind": "type_identifier"
        "nthChild": 1
      - "inside":
          "field": "name"
          "kind": "enum_declaration"
        "kind": "identifier"
...
