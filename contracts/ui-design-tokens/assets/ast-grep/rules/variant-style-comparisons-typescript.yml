# ui-design-tokens: select a variant's style by indexing one style definition keyed by the variant's members, never by comparing the variant with a member.
# TypeScript variant (.ts, .mts, .cts); it differs from the Tsx variant only in `id`, `language`, and this line.
# The rule targets StyleX, whose `stylex.create` defines styles as an object keyed by name and whose `stylex.props` applies them.
# A repository on another styling library with such objects writes its own rule for that library's apply call.
id: variant-style-comparisons-typescript
language: TypeScript
severity: error
message: Index one style definition keyed by the variant's members, such as `toneStyles[tone]`, instead of comparing the variant with a member.
note: |
  A comparison with `===`, `==`, `!==`, or `!=` reports when one side is a fixed value and the comparison is an operand of `&&` inside the arguments of `stylex.props`.
  A fixed value is a string literal or a member of a capitalized name, such as `Tone.Positive`.
  A comparison of two run-time values, such as `row.id === selectedId && styles.selected`, is a boolean condition, not a variant, and is not reported.
  A type test, such as `typeof size === 'number' && styles.fixed`, is not reported.
  Give every member a key, with an empty style for a member that adds nothing, so a type checker rejects a member added without a style.
utils:
  # A value fixed in the source, such as `'positive'` or `Tone.Positive`.
  fixed-value:
    any:
      - kind: string
      - kind: member_expression
        has:
          field: object
          kind: identifier
          regex: "^[A-Z]"
  # A comparison of a value with a fixed value, such as `tone === 'positive'`.
  member-comparison:
    kind: binary_expression
    not:
      has:
        kind: unary_expression
        regex: "^typeof"
    all:
      - has:
          field: operator
          regex: "^[!=]==?$"
      - any:
          - has:
              field: left
              matches: fixed-value
          - has:
              field: right
              matches: fixed-value
rule:
  matches: member-comparison
  inside:
    kind: binary_expression
    has:
      field: operator
      regex: "^&&$"
    inside:
      kind: arguments
      stopBy: end
      inside:
        kind: call_expression
        pattern: stylex.props($$$)
