---
# code-diagnostic-messages: quote every value a diagnostic interpolates with `{value:?}`, and append a cause's own message after a colon as `{error:#}`.
# Rust variant; the TypeScript and Tsx variants apply the same test to their error messages.
"id": "diagnostic-values-rust"
"language": "Rust"
"message": "Quote this interpolated value as `{value:?}`, such as `invoice {invoice_id:?} is closed`, unless it is a cause's message after a colon, written `{error:#}`."
"note": |
  The rule reads each placeholder of a format string that is an error's or a panic's message, and allows only `{value:?}`, `{0:?}`, or `{:?}`, and a cause's message.
  A cause's message is a placeholder in the alternate form that follows `: `, such as `read {path:?}: {error:#}`, which prints a chained error's whole chain.
  A placeholder such as `{}`, `{name}`, `{0}`, or `{count:>5}` is reported, whatever the value's type; a number is quoted too.
  An error's or a panic's message is the format string of `anyhow!`, `bail!`, `ensure!`, `panic!`, `unreachable!`, `todo!`, `unimplemented!`, the assert macros, and `#[error(...)]`.
  It is also a `format!` string passed to `.context(...)`, `.with_context(...)`, `.expect(...)`, `.map_err(...)`, `.ok_or(...)`, `.ok_or_else(...)`, or `Err(...)`.
  A log line is a record, not a diagnostic, and a line a print macro writes is the output module's, so neither is read; a diagnostic that another function writes is left to review.
"rule":
  "any":
    # `bail!("...")`, `anyhow!("...")`, and `panic!("...")`.
    - "inside":
        "inside":
          "matches": "message-macro"
        "kind": "token_tree"
      "matches": "first-string"
    # `ensure!(ready, "...")` and `assert!(ready, "...")`.
    - "follows":
        "regex": "^,$"
        "stopBy": "end"
      "inside":
        "inside":
          "matches": "condition-macro"
        "kind": "token_tree"
    # `assert_eq!(left, right, "...")`.
    - "follows":
        "follows":
          "regex": "^,$"
          "stopBy": "end"
        "regex": "^,$"
        "stopBy": "end"
      "inside":
        "inside":
          "matches": "comparison-macro"
        "kind": "token_tree"
    # `#[error("...")]`.
    - "inside":
        "inside":
          "has":
            "regex": "^error$"
          "kind": "attribute"
        "kind": "token_tree"
      "matches": "first-string"
    # `.with_context(|| format!("..."))` and `Err(format!("..."))`.
    - "inside":
        "inside":
          "has":
            "field": "macro"
            "regex": "^format$"
          "inside":
            "inside":
              "matches": "message-call"
            "kind": "arguments"
            "stopBy": "end"
          "kind": "macro_invocation"
        "kind": "token_tree"
      "matches": "first-string"
  "matches": "unquoted-placeholder"
"severity": "error"
"utils":
  # A macro whose message follows the two compared values.
  "comparison-macro":
    "has":
      "field": "macro"
      "regex": "(?:^|::)(?:debug_)?assert_(?:eq|ne)$"
    "kind": "macro_invocation"
  # A macro whose message follows a condition.
  "condition-macro":
    "has":
      "field": "macro"
      "regex": "(?:^|::)(?:ensure|(?:debug_)?assert)$"
    "kind": "macro_invocation"
  # The first string literal of a macro's arguments.
  "first-string":
    "not":
      "follows":
        "any":
          - "kind": "string_literal"
          - "kind": "raw_string_literal"
        "stopBy": "end"
  # A call that attaches or states a message, such as `.context(format!(...))`, or builds an error, `Err(format!(...))`.
  "message-call":
    "any":
      - "has":
          "field": "function"
          "has":
            "field": "field"
            "regex": "^(?:context|with_context|expect|map_err|ok_or|ok_or_else)$"
          "kind": "field_expression"
      - "has":
          "field": "function"
          "regex": "^Err$"
    "kind": "call_expression"
  # A macro that fails or panics with its first argument as the message.
  "message-macro":
    "has":
      "field": "macro"
      "regex": "(?:^|::)(?:anyhow|bail|panic|unreachable|todo|unimplemented)$"
    "kind": "macro_invocation"
  # A format string with a placeholder that neither quotes its value nor appends a cause after a colon.
  "unquoted-placeholder":
    "all":
      - "any":
          - "kind": "string_literal"
          - "kind": "raw_string_literal"
      - "any":
          # `{}`, `{name}`, and `{0}`.
          - "regex": '(?:^r?#*"|[^{])\{[^{}:]*\}'
          # `{count:>5}`, `{name:#?}`, and every other form but `{name:?}` and `{name:#}`.
          - "regex": '(?:^r?#*"|[^{])\{[^{}:]*:(?:[^{}]{2,}|[^{}?#]|)\}'
          # `{error:#}` anywhere but after `: `.
          - "regex": '(?:^r?#*"|[^ {]|[^:] )\{[^{}:]*:#\}'
...
