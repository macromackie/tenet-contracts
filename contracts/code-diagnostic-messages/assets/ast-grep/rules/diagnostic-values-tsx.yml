---
# code-diagnostic-messages: quote every value a diagnostic interpolates with `JSON.stringify(value)`, and append a cause's own message after a colon unquoted.
# Tsx variant (.tsx); diagnostic-values-typescript.yml is identical except for `id`, `language`, and this line.
"id": "diagnostic-values-tsx"
"language": "Tsx"
"message": "Quote this interpolated value as `${JSON.stringify(value)}`, such as `invoice ${JSON.stringify(invoiceId)} is closed`, unless it is a cause's message after a colon."
"note": |
  The rule reads each `${...}` of a template literal that is an error's message, and allows only `${JSON.stringify(value)}` and a cause's message.
  A cause's message is a `message` read, such as `${error.message}`, that follows `: ` in the template, as in `read ${JSON.stringify(path)}: ${error.message}`.
  `String(value)` and a bare value are reported, whatever the value's type; a number is quoted too, and a `bigint` is quoted as `JSON.stringify(String(amount))`.
  An error's message is the first argument of an error constructor whose name ends in `Error` or `Exception`, of `Effect.fail` or `Effect.die`, and a thrown template.
  It is also the `message` of a thrown or failed error's object argument, the first argument of `super(...)` and a `message` field or getter in an error class, and a `message` beside a `code` or `_tag` in an error result.
  A log line is a record, not a diagnostic, and a line written to standard error is the output module's, so neither is read; a diagnostic that another function writes, such as `fail({ line })`, is left to review.
"rule":
  "inside":
    "matches": "message-template"
  "kind": "template_substitution"
  "not":
    "any":
      - "matches": "quoted-value"
      - "matches": "cause-message"
"severity": "error"
"utils":
  # A substitution that appends a cause's message after a colon, `: ${error.message}`.
  "cause-message":
    "follows":
      "kind": "string_fragment"
      "regex": ':\s$'
    "has":
      "has":
        "field": "property"
        "regex": "^message$"
      "kind": "member_expression"
  # A class that extends an error type, such as `Data.TaggedError('InvoiceMissing')` or `Schema.TaggedError<JobLate>()(...)`.
  "error-class":
    "has":
      "kind": "class_heritage"
      "regex": '(?:Error|Exception)(?:Class)?\b'
    "kind": "class_declaration"
  # A constructor or call that names an error type, such as `new InvoiceError(...)` or `TypeError(...)`.
  "error-constructor":
    "any":
      - "has":
          "field": "constructor"
          "regex": "(?:Error|Exception)$"
        "kind": "new_expression"
      - "has":
          "field": "function"
          "kind": "identifier"
          "regex": "^(?:[A-Z][A-Za-z]*)?(?:Error|Exception)$"
        "kind": "call_expression"
        "not":
          "inside":
            "kind": "class_heritage"
            "stopBy": "end"
  # A place where a constructed error is thrown or failed, such as `throw new InvoiceMissing({ ... })`.
  "failed-error":
    "any":
      - "inside":
          "any":
            - "kind": "throw_statement"
            - "kind": "yield_expression"
      - "inside":
          "inside":
            "matches": "failing-call"
          "kind": "arguments"
      - "inside":
          "any":
            - "inside":
                "field": "value"
                "has":
                  "field": "key"
                  "regex": "^catch$"
                "kind": "pair"
            - "inside":
                "inside":
                  "has":
                    "field": "function"
                    "regex": '(?:^|\.)mapError$'
                  "kind": "call_expression"
                "kind": "arguments"
          "field": "body"
          "kind": "arrow_function"
    "kind": "new_expression"
  # A call that fails or dies with a message in Effect.
  "failing-call":
    "has":
      "field": "function"
      "regex": '^Effect\.(?:fail|die)$'
    "kind": "call_expression"
  # A template literal that is an error's message.
  "message-template":
    "any":
      # `new Error(`...`)`, `TypeError(`...`)`, and `Effect.fail(`...`)`.
      - "inside":
          "inside":
            "any":
              - "matches": "error-constructor"
              - "matches": "failing-call"
          "kind": "arguments"
        "nthChild": 1
      # `super(`...`)` in an error class's constructor.
      - "inside":
          "inside":
            "has":
              "field": "function"
              "kind": "super"
            "inside":
              "matches": "error-class"
              "stopBy": "end"
            "kind": "call_expression"
          "kind": "arguments"
        "nthChild": 1
      # `throw `...``.
      - "inside":
          "kind": "throw_statement"
      # `new InvoiceMissing({ message: `...` })` where it is thrown or failed, or inside any error constructor.
      - "inside":
          "field": "value"
          "has":
            "field": "key"
            "regex": '^["'']?message["'']?$'
          "inside":
            "inside":
              "inside":
                "any":
                  - "matches": "error-constructor"
                  - "matches": "failed-error"
              "kind": "arguments"
            "kind": "object"
            "nthChild": 1
          "kind": "pair"
      # `return { ok: false, code: 'order_closed', message: `...` }`, a message beside a code or tag in an error result.
      - "inside":
          "field": "value"
          "has":
            "field": "key"
            "regex": '^["'']?message["'']?$'
          "inside":
            "has":
              "any":
                - "has":
                    "field": "key"
                    "regex": '^["'']?(?:code|_tag)["'']?$'
                  "kind": "pair"
                - "kind": "shorthand_property_identifier"
                  "regex": "^(?:code|_tag)$"
            "kind": "object"
          "kind": "pair"
      # `get message() { return `...` }` and `readonly message = `...`` in an error class.
      - "inside":
          "inside":
            "has":
              "field": "name"
              "regex": "^message$"
            "inside":
              "matches": "error-class"
              "stopBy": "end"
            "kind": "method_definition"
            "stopBy": "end"
          "kind": "return_statement"
      - "inside":
          "field": "value"
          "has":
            "field": "name"
            "regex": "^message$"
          "inside":
            "matches": "error-class"
            "stopBy": "end"
          "kind": "public_field_definition"
    "kind": "template_string"
  # A substitution that quotes its value, `${JSON.stringify(value)}`.
  "quoted-value":
    "has":
      "has":
        "field": "function"
        "regex": '^JSON\.stringify$'
      "kind": "call_expression"
...
