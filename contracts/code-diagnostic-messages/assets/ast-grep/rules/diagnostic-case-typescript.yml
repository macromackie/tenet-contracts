---
# code-diagnostic-messages: start each diagnostic with a lowercase word unless that word is a proper noun or an identifier written as it is spelled.
# TypeScript variant (.ts, .mts, .cts); diagnostic-case-tsx.yml is identical except for `id`, `language`, and this line.
"id": "diagnostic-case-typescript"
"language": "TypeScript"
"message": "Start this diagnostic with a lowercase word, such as `order 42 was not found`, unless its first word is a proper noun or an identifier."
"note": |
  The first word is the leading run of letters, with apostrophes and hyphens, of a string or template literal.
  A word that holds a capital after its first letter or any digit, dot, or underscore, such as `GitHub`, `URL`, or `Order.settle`, is an identifier and is allowed.
  A message that starts with an interpolated value, a quote, or another non-letter, such as `${JSON.stringify(path)}: not found`, is allowed.
  The rule reads the first argument of an error constructor whose name ends in `Error` or `Exception`, a thrown string, and the `message` of a thrown or failed error.
  It also reads the first argument of `super(...)` and a `message` field or getter in an error class, `Effect.fail`, `Effect.die`, and the standard error console and stream calls.
  A diagnostic that another function writes, such as an output module's `fail({ line })`, is left to review.
"rule":
  "any":
    # `new Error('...')`, `TypeError('...')`, and `console.error('...')`.
    - "inside":
        "inside":
          "any":
            - "matches": "error-constructor"
            - "matches": "diagnostic-call"
        "kind": "arguments"
      "nthChild": 1
    # `super('...')` in an error class's constructor.
    - "inside":
        "inside":
          "has":
            "field": "function"
            "kind": "super"
          "inside":
            "matches": "error-class"
            "stopBy": "end"
          "kind": "call_expression"
        "kind": "arguments"
      "nthChild": 1
    # `throw '...'`.
    - "inside":
        "kind": "throw_statement"
    # `new InvoiceMissing({ message: '...' })` where it is thrown or failed, or inside any error constructor.
    - "inside":
        "field": "value"
        "has":
          "field": "key"
          "regex": '^["'']?message["'']?$'
        "inside":
          "inside":
            "inside":
              "any":
                - "matches": "error-constructor"
                - "matches": "failed-error"
            "kind": "arguments"
          "kind": "object"
          "nthChild": 1
        "kind": "pair"
    # `get message() { return '...' }` and `readonly message = '...'` in an error class.
    - "inside":
        "inside":
          "has":
            "field": "name"
            "regex": "^message$"
          "inside":
            "matches": "error-class"
            "stopBy": "end"
          "kind": "method_definition"
          "stopBy": "end"
        "kind": "return_statement"
    - "inside":
        "field": "value"
        "has":
          "field": "name"
          "regex": "^message$"
        "inside":
          "matches": "error-class"
          "stopBy": "end"
        "kind": "public_field_definition"
  "matches": "capitalized-text"
"severity": "error"
"utils":
  # A string or template literal whose first word is one capital followed by lowercase letters, and not a declared proper noun.
  "capitalized-text":
    "any":
      - "kind": "string"
      - "kind": "template_string"
    "not":
      "matches": "proper-noun-text"
    "regex": '^["''`][A-Z][a-z]*(?:\\?''[a-z]+)?(?:-[a-z]+)*(?:[\s:,;!?)"''`]|\.(?:\s|["''`]))'
  # A call that fails or dies in Effect, or writes to standard error.
  "diagnostic-call":
    "has":
      "field": "function"
      "regex": '^(?:Effect\.(?:fail|failSync|die)|Console\.(?:error|warn)|console\.(?:error|warn)|process\.stderr\.write)$'
    "kind": "call_expression"
  # A class that extends an error type, such as `Data.TaggedError('Late')` or `Schema.TaggedError<Late>()(...)`.
  "error-class":
    "has":
      "kind": "class_heritage"
      "regex": '(?:Error|Exception)(?:Class)?\b'
    "kind": "class_declaration"
  # A constructor or call that names an error type, such as `new InvoiceError(...)` or `TypeError(...)`.
  "error-constructor":
    "any":
      - "has":
          "field": "constructor"
          "regex": "(?:Error|Exception)$"
        "kind": "new_expression"
      - "has":
          "field": "function"
          "kind": "identifier"
          "regex": "^(?:[A-Z][A-Za-z]*)?(?:Error|Exception)$"
        "kind": "call_expression"
        "not":
          "inside":
            "kind": "class_heritage"
            "stopBy": "end"
  # A place where a constructed error is thrown or failed, such as `throw new InvoiceMissing({ ... })`.
  "failed-error":
    "any":
      - "inside":
          "any":
            - "kind": "throw_statement"
            - "kind": "yield_expression"
      - "inside":
          "inside":
            "matches": "diagnostic-call"
          "kind": "arguments"
      - "inside":
          "any":
            - "inside":
                "field": "value"
                "has":
                  "field": "key"
                  "regex": "^catch$"
                "kind": "pair"
            - "inside":
                "inside":
                  "has":
                    "field": "function"
                    "regex": '(?:^|\.)mapError$'
                  "kind": "call_expression"
                "kind": "arguments"
          "field": "body"
          "kind": "arrow_function"
    "kind": "new_expression"
...
