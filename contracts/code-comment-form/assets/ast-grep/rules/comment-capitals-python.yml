# code-comment-form: write every comment as sentences that start with a capital letter.
# Python variant; JavaScript, TypeScript, and Tsx files take the same test from this contract's oxlint configuration.
id: comment-capitals-python
language: Python
severity: error
message: Start this comment with a capital letter, or put the code identifier that opens it in backticks.
note: |
  The rule reports a comment or a docstring whose first letter is lowercase, such as `# retry_after is absent` or `"""returns the total."""`.
  A comment that opens with no letter is not reported, so a backticked identifier, a shebang, a coding line, a script metadata block, and a number pass.
  A comment that opens with a link, such as `# https://...`, is not reported.
  A comment directly after another comment continues its sentence, so it is not reported.
  A tool's directive is not reported: `ast-grep-ignore`, a check's `-allow` directive, `noqa`, `type:`, `pragma:`, `fmt:`, `isort:`, `ruff:`, `ty:`, `pyright:`, `mypy:`, `pylint:`, `coding:`, and `vim:`.
  A repository adds the directive words of its other tools to that list in its copy of this rule.
rule:
  any:
    - kind: comment
      regex: ^#[ \t]*\p{Ll}
      not:
        any:
          - regex: ^#[ \t]*(?:ast-grep-ignore|[a-z0-9]+(?:-[a-z0-9]+)*-allow\b|noqa\b|type:|pragma:|fmt:|isort:|ruff:|ty:|pyright:|mypy:|pylint:|coding[:=]|vim:|[a-z][a-z0-9+.-]*://)
          - follows:
              kind: comment
              immediate: true
    - kind: string
      inside:
        kind: expression_statement
      regex: ^[rRuU]?(?:"""|'''|"|')\s*\p{Ll}
