# code-comment-form: never write a copyright or license notice in a source file, because the repository's `LICENSE` file states it once.
# Tsx variant (.tsx); the other variants apply the same test to their language's comments.
id: license-notices-tsx
language: Tsx
severity: error
message: Remove this copyright or license notice, because the repository's `LICENSE` file states the license once for every file.
note: |
  The rule reports a comment that opens with `Copyright`, `©`, `(c)` and a year, `Licensed under`, `@license`, or `SPDX-License-Identifier:`, after any comment markers and asterisks.
  A comment that mentions copyright later in a sentence is not reported.
rule:
  kind: comment
  regex: ^(?://[/!]?|/\*[*!]?)[\s*]*(?:SPDX-License-Identifier:|Copyright\b|@license\b|©|\(c\)\s*\d|Licensed under\b)
