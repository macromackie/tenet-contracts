---
# The strictest zizmor settings that code-lint-strictness requires.
# zizmor runs every audit by default; this file sets the strictest policy of each audit that takes one,
# and turns one off, with its reason letters on the line above it.
#
# zizmor reads only its own file, so copy this file to `.github/zizmor.yml`.
# List each action the workflows use under `forbidden-uses` in that copy, as an owner, `owner/repo`, or `owner/repo@ref` pattern.
# Run it from the repository root with the auditor persona, which reports every finding of every audit:
#   zizmor --persona=auditor --strict-collection .
# Give the run a read-only GitHub token in `GH_TOKEN`, because online audits such as impostor-commit,
# ref-confusion, and known-vulnerable-actions run only with one.
# Any finding, informational ones included, ends zizmor with a nonzero exit code.
# A new zizmor version adds audits, so this file is tested against zizmor 1.31.1;
# pin that exact version and raise it in a reviewed upgrade.

"rules":
  "forbidden-uses":
    "config":
      # An empty allow list reports every action, so each action a workflow uses is listed before it runs.
      "allow": []
  # R: the audit asks for the `$/` form of a same-repository action or reusable workflow,
  # which actionlint 1.7.12 rejects in `uses:`; it accepts only the `./` form.
  # Turn the audit back on when the pinned actionlint accepts `$/`.
  "self-repository":
    "disable": true
  "unpinned-uses":
    "config":
      "policies":
        # Every action, first-party ones included, is pinned to a full commit hash.
        "*": "hash-pin"
...
