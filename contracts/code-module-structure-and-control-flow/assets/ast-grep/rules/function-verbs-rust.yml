# code-module-structure-and-control-flow: every owned function name that starts in lowercase starts with a verb from the declared list.
# Rust variant; it also accepts the constructor and conversion prefixes new, from, into, as, to, and with.
# The alternation below holds every word of verbs.txt beside this folder, plus those six prefixes; keep the two identical when either changes.
# Scan with this folder's sgconfig.yml and exclude the declared generated path patterns, such as
# `ast-grep scan -c .contracts/NNN-code-module-structure-and-control-flow/assets/ast-grep/sgconfig.yml --globs '!src/generated/**'`.
id: function-verbs-rust
language: Rust
severity: error
message: Start this function's name with a verb from the declared list, such as `read_invoice` rather than `invoice`.
note: |
  A free function, a method, and a trait's method declaration are checked; the first word is the name's leading run before `_`.
  A method that implements a trait, `main`, a `#[test]` function, even below other attributes, and a getter whose body only returns a field of `self` are not checked.
  Suppress a name that an interface or framework outside the repository fixes, with a reason that names that system.
rule:
  kind: identifier
  regex: ^_*[a-z]
  inside:
    field: name
    any:
      - kind: function_signature_item
      - kind: function_item
        not:
          any:
            # A getter, such as `fn total(&self) -> Money { self.total }`, is named for its field.
            - has:
                field: body
                regex: ^\{\s*&?(mut\s+)?self\.[a-z0-9_]+(\.clone\(\))?\s*\}$
            # A test function's name is its title, as a test runner reports it.
            - follows:
                kind: attribute_item
                regex: ^#\[(tokio::)?test\b
                stopBy:
                  not:
                    kind: attribute_item
  not:
    any:
      - regex: ^_*(abort|accept|acquire|add|admit|advance|aggregate|allocate|allow|answer|append|apply|approve|archive|arm|assert|assess|assign|attach|audit|authenticate|authorize|await|backfill|begin|bind|block|build|bump|calculate|call|can|cancel|capture|change|check|choose|claim|classify|clean|clear|clip|close|collect|combine|commit|compare|compile|complete|compose|compress|compute|configure|confirm|connect|consume|continue|convert|copy|count|create|decide|declare|decode|decrypt|deduplicate|define|delete|deliver|deny|deploy|derive|describe|detach|detect|diagnose|diff|disable|discard|discover|dismiss|dispatch|dispose|download|drain|draw|drop|edit|emit|enable|encode|encrypt|end|enforce|enqueue|enroll|ensure|enter|escape|estimate|evaluate|exchange|exclude|execute|exit|expand|expect|expire|explain|export|expose|extend|extract|fail|feed|fill|filter|find|finish|flush|focus|fold|follow|force|format|forward|freeze|generate|grade|grant|group|guard|handle|has|hash|hide|hold|identify|ignore|import|include|increment|index|infer|ingest|initialize|insert|inspect|install|invoke|is|issue|join|judge|keep|kill|label|launch|lease|leave|limit|link|list|listen|lock|log|look|make|map|mark|mask|match|measure|merge|migrate|mint|mock|mount|move|name|navigate|needs|normalize|notify|observe|obtain|on|open|order|pack|page|paginate|parse|patch|pause|pick|pin|place|plan|poll|post|prepare|present|preserve|print|probe|process|produce|promote|prompt|protect|provide|provision|prune|publish|pull|push|put|qualify|query|queue|quote|raise|rank|read|reap|rebuild|receive|recheck|reconcile|record|recover|redact|redeem|redirect|reduce|refresh|refund|refuse|register|reject|release|reload|remember|remove|rename|render|renew|reopen|repair|repeat|replace|replay|reply|report|request|require|reserve|reset|resolve|respond|restart|restore|resume|retain|retry|return|reveal|review|revoke|rotate|route|run|sample|save|scale|scan|schedule|score|seal|search|seed|select|send|serialize|serve|set|settle|share|ship|should|show|sign|signal|simulate|skip|sleep|slice|sort|spawn|split|start|stop|store|stream|strip|submit|subscribe|sum|summarize|supply|suspend|sync|tag|take|terminate|test|throw|toggle|touch|trace|track|transform|translate|trigger|trim|truncate|try|unlabel|unlock|unpack|unregister|unset|unsubscribe|unwrap|update|upgrade|upload|upsert|use|validate|vend|verify|view|visit|wait|wake|walk|warn|was|watch|wrap|write|yield|new|from|into|as|to|with)(_|$)
      - regex: ^main$
      # A method that implements a trait keeps the trait's name.
      - inside:
          kind: impl_item
          has:
            field: trait
            regex: .
          stopBy: end
