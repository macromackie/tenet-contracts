---
# ui-react-hook-calls: call state, ref, and context hooks before every other hook, and effect hooks after every other hook.
# JavaScript variant (.js, .jsx, .mjs, .cjs); it differs from the Tsx and TypeScript variants only in `id`, `language`, and this line.
# Scan with this folder's sgconfig.yml, such as `ast-grep scan -c .contracts/NNN-ui-react-hook-calls/assets/ast-grep/sgconfig.yml`.
"id": "hook-order-javascript"
"language": "JavaScript"
"message": "Call state, ref, and context hooks before every other hook, and effect hooks after every other hook, in the same body."
"note": |
  A hook is a function whose name is `use` followed by a capital letter or digit, called directly or as a member such as `React.useState`.
  State, ref, and context hooks are `useState`, `useReducer`, `useRef`, and `useContext`.
  Effect hooks are `useEffect`, `useLayoutEffect`, and `useInsertionEffect`.
  A statement that calls a state, ref, or context hook after a statement that calls any other hook is reported.
  A statement that calls a hook of neither kind after a statement that calls an effect hook is reported.
  Statements that call no hook may stand anywhere, and calls inside nested functions are not counted.
"rule":
  "any":
    - "all":
        - "matches": "calls-first-hook"
        - "follows":
            "matches": "calls-later-hook"
            "stopBy": "end"
    - "all":
        - "matches": "calls-middle-hook"
        - "follows":
            "matches": "calls-effect-hook"
            "stopBy": "end"
"severity": "error"
"utils":
  "calls-effect-hook":
    "has":
      "matches": "effect-hook-call"
      "stopBy":
        "matches": "nested-function"
    "matches": "hook-statement"
  "calls-first-hook":
    "has":
      "matches": "first-hook-call"
      "stopBy":
        "matches": "nested-function"
    "matches": "hook-statement"
  "calls-later-hook":
    "has":
      "all":
        - "matches": "hook-call"
        - "not":
            "matches": "first-hook-call"
      "stopBy":
        "matches": "nested-function"
    "matches": "hook-statement"
  "calls-middle-hook":
    "has":
      "all":
        - "matches": "hook-call"
        - "not":
            "matches": "first-hook-call"
        - "not":
            "matches": "effect-hook-call"
      "stopBy":
        "matches": "nested-function"
    "matches": "hook-statement"
  "effect-hook-call":
    "has":
      "any":
        - "kind": "identifier"
          "regex": "^(useEffect|useLayoutEffect|useInsertionEffect)$"
        - "has":
            "field": "property"
            "regex": "^(useEffect|useLayoutEffect|useInsertionEffect)$"
          "kind": "member_expression"
      "field": "function"
    "kind": "call_expression"
  "first-hook-call":
    "has":
      "any":
        - "kind": "identifier"
          "regex": "^(useState|useReducer|useRef|useContext)$"
        - "has":
            "field": "property"
            "regex": "^(useState|useReducer|useRef|useContext)$"
          "kind": "member_expression"
      "field": "function"
    "kind": "call_expression"
  "hook-call":
    "has":
      "any":
        - "kind": "identifier"
          "regex": "^use[A-Z0-9]"
        - "has":
            "field": "property"
            "regex": "^use[A-Z0-9]"
          "kind": "member_expression"
      "field": "function"
    "kind": "call_expression"
  "hook-statement":
    "any":
      - "kind": "lexical_declaration"
      - "kind": "variable_declaration"
      - "kind": "expression_statement"
      - "kind": "return_statement"
  "nested-function":
    "any":
      - "kind": "arrow_function"
      - "kind": "function_expression"
      - "kind": "function_declaration"
      - "kind": "generator_function"
      - "kind": "generator_function_declaration"
      - "kind": "method_definition"
      - "kind": "class_declaration"
      - "kind": "class"
...
