---
"concurrency":
  "cancel-in-progress": false
  "group": "release"
"jobs":
  "check":
    "name": "Check"
    "permissions":
      "contents": "read" # The check reads the checkout.
    "uses": "./.github/workflows/check.yml"
  "release":
    "name": "Tag and publish"
    "needs":
      - "check"
    "permissions":
      "contents": "write" # Create the version tag and its GitHub release.
    "runs-on": "namespace-profile-public-linux"
    "steps":
      - "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803" # v6
        "with":
          "persist-credentials": false
      - "env":
          "GH_REPO": "${{ github.repository }}"
          "GH_TOKEN": "${{ github.token }}"
        "name": "Tag and publish the version commit"
        "run": |
          set -euo pipefail
          tag=$(git log -1 --format=%B)
          if ! [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Not a version commit; nothing to release."
            exit 0
          fi
          awk -v heading="## ${tag}" '$0 == heading {found = 1; next} found && /^## / {exit} found' CHANGELOG.md > "${RUNNER_TEMP}/notes.md"
          if ! grep -q . "${RUNNER_TEMP}/notes.md"; then
            echo "::error file=CHANGELOG.md::Add a ## ${tag} section before releasing."
            exit 1
          fi
          existing=$(git ls-remote --tags origin "refs/tags/${tag}" | cut -f1)
          if [[ -n "${existing}" && "${existing}" != "${GITHUB_SHA}" ]]; then
            echo "::error::${tag} already points to a different commit. Use a new version."
            exit 1
          fi
          if [[ -z "${existing}" ]]; then
            gh api "repos/${GH_REPO}/git/refs" -f ref="refs/tags/${tag}" -f sha="${GITHUB_SHA}" > /dev/null
          fi
          if gh release view "${tag}" > /dev/null 2>&1; then
            echo "${tag} is already published."
            exit 0
          fi
          gh release create "${tag}" --verify-tag --title "${tag}" --notes-file "${RUNNER_TEMP}/notes.md"
    "timeout-minutes": 10
"name": "Release"
"on":
  "push":
    "branches":
      - "main"
  "workflow_dispatch": {}
"permissions": {}
...
